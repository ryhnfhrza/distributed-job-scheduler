<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#1a0f0f; font-family:Georgia, serif;">

<div style="
    max-width:700px;
    margin:40px auto;
    background:#2b1515;
    border:2px solid #a07a3d;
    box-shadow:0 0 25px rgba(0,0,0,0.9);
">

    <!-- Accent Bar Emas Lannister -->
    <div style="height:8px; background:#a07a3d;"></div>

    <div style="
        background:#f6efe3;
        padding:50px;
        color:#3a2c1a;
        line-height:1.8;
        font-size:16px;
    ">

        <!-- Menampilkan Judul (Title) -->
        <h2 style="margin-top:0; color:#2b1515; border-bottom:1px solid #d4c4a8; padding-bottom:10px;">
            {{.Title}}
        </h2>

        <div style="
            border-left:4px solid #a07a3d;
            padding-left:20px;
        ">
            <!-- Menampilkan Isi (Content) -->
            {{.Content}}
        </div>

        <!-- Dekorasi Lingkaran Aman (Tanpa absolute) -->
        <div style="
            margin-top: 30px;
            text-align: right;
        ">
             <div style="
                display:inline-block;
                width:45px;
                height:45px;
                border-radius:50%;
                background:#a07a3d;
                opacity:0.3;
                box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
            "></div>
        </div>

    </div>
</div>

</body>
</html>
