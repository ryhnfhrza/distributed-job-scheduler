<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#0e0e0e; font-family:Georgia, serif;">

<div style="
    max-width:700px;
    margin:40px auto;
    background:#1a1a1a;
    border:2px solid #3a3a3a;
    box-shadow:0 0 20px rgba(0,0,0,0.8);
">

    <div style="height:8px; background:#4a4a4a;"></div>

    <div style="
        background:#f5f3ee;
        padding:50px;
        color:#2e2e2e;
        line-height:1.8;
        font-size:16px;
    ">

        <h2 style="margin-top:0; color:#1a1a1a; border-bottom:1px solid #ccc; padding-bottom:10px;">
            {{.Title}}
        </h2>

        <div style="
            border-left:4px solid #666;
            padding-left:20px;
        ">
            {{.Content}}
        </div>

        <div style="
            margin-top: 30px;
            text-align: right;
        ">
             <div style="
                display:inline-block;
                width:40px;
                height:40px;
                border-radius:50%;
                background:#2e2e2e;
                opacity:0.2;
            "></div>
        </div>

    </div>
</div>

</body>
</html>
