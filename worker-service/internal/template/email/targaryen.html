<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background:#000000; font-family:Georgia, serif;">

<div style="
    max-width:700px;
    margin:40px auto;
    background:#1a0000;
    border:2px solid #7a0000;
    box-shadow:0 0 30px rgba(255,0,0,0.3);
">

    <div style="height:8px; background:#7a0000;"></div>

    <div style="
        background:#f4eaea;
        padding:50px;
        color:#2a0000;
        line-height:1.8;
        font-size:16px;
    ">

    
        <h2 style="margin-top:0; color:#1a0000; border-bottom:1px solid #d8c4c4; padding-bottom:10px;">
            {{.Title}}
        </h2>

        <div style="
            border-left:4px solid #7a0000;
            padding-left:20px;
        ">
            {{.Content}}
        </div>

 
        <div style="
            margin-top: 30px;
            text-align: right;
        ">
             <div style="
                display:inline-block;
                width:45px;
                height:45px;
                border-radius:50%;
                background:#7a0000;
                opacity:0.35;
            "></div>
        </div>

    </div>
</div>

</body>
</html>
