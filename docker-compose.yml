version: '3.8'

services:
  # --- DATABASE ---
  db:
    image: mysql:8.0
    container_name: job_scheduler_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MIGRATION ---
  migration:
    image: migrate/migrate:latest
    container_name: job_scheduler_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations
      -database "mysql://${DB_USER}:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}"
      up
    restart: "no"

  # --- REDIS ---
  redis:
    image: redis:7.2-alpine
    container_name: job_scheduler_redis
    restart: always
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API SERVICE ---
  api-service:
    build: ./api-service
    image: ezioauditore2/distributed-job-scheduler_api-service:latest
    container_name: api-service
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always

  # --- SCHEDULER SERVICE ---
  scheduler-service:
    build: ./scheduler-service
    image: ezioauditore2/distributed-job-scheduler_scheduler-service:latest
    container_name: scheduler-service
    depends_on:
      db:
        condition: service_healthy
      api-service:
        condition: service_started
    env_file:
      - .env
    restart: always

  # --- WORKER SERVICE ---
  worker-service:
    build: ./worker-service
    image: ezioauditore2/distributed-job-scheduler_worker-service:latest
    container_name: worker-service
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
      - ./worker-service/internal/config/.env
    restart: always

volumes:
  db_data:
  redis_data: